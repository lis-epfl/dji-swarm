// Mirrors lis-swarm-app/build.gradle (known-good with MSDK 5.3.0). The committed gradlew
// pins Gradle 9.0.0, which this build has never been tried with: build with the local
// Gradle 8.11.1 dist and the Android Studio JBR (see rc-joystick/README.md).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://artifact.bytedance.com/repository/pcdn/msdk/maven/' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
