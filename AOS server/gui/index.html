<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>LIS_Swarm — Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --bg: #0d1117; --panel: rgba(20,26,34,0.92); --line: #2a3340;
    --text: #e6edf3; --muted: #8b949e; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif;
               background: var(--bg); color: var(--text); overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--bg); }

  /* ---- top banner ---- */
  #banner {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; padding: 6px 16px; border-radius: 20px; font-size: 13px;
    font-weight: 600; letter-spacing: .3px; background: var(--panel);
    border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.4);
    display: flex; gap: 10px; align-items: center; white-space: nowrap;
  }
  #banner .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  #banner.ok   .dot { background: var(--ok);   box-shadow: 0 0 8px var(--ok); }
  #banner.warn .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  #banner.bad  .dot { background: var(--bad);  box-shadow: 0 0 8px var(--bad); }
  #banner .sub { color: var(--muted); font-weight: 400; }
  #banner .chip { font-weight: 600; font-size: 12px; padding: 2px 10px; border-radius: 12px;
                  background: rgba(159,216,255,.16); color: #9fd8ff; border: 1px solid var(--line); }

  /* ---- status panel ---- */
  #panel {
    position: absolute; top: 10px; right: 10px; bottom: 10px; width: 300px;
    z-index: 1000; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.5);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #panel h1 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line);
              display: flex; justify-content: space-between; align-items: center; }
  #panel h1 .count { color: var(--muted); font-weight: 400; font-size: 12px; }
  #cards { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  #cards:empty::after { content: "No drones reporting yet."; color: var(--muted);
                        font-size: 13px; padding: 10px; }

  /* ---- Olfati-Saber parameter footer ---- */
  #params { border-top: 1px solid var(--line); padding: 10px 14px 12px;
            background: rgba(255,255,255,0.015); }
  #params .params-hd { font-size: 11px; font-weight: 700; letter-spacing: .4px;
                       text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  #params-grid { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 12px; }
  #params-grid .pk { color: var(--muted); }
  #params-grid .pv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  #params-grid .pv.dyn { color: #9fd8ff; }

  .card { border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px;
          padding: 8px 10px; background: rgba(255,255,255,0.02); }
  .card .hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card .badge { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
                 font-weight: 700; font-size: 12px; color: #06121e; }
  .card .name { font-weight: 600; font-size: 13px; }
  .card .pill { margin-left: auto; font-size: 11px; padding: 1px 8px; border-radius: 10px;
                font-weight: 600; }
  .pill.hull { background: rgba(63,192,255,.18); color: #3fc0ff; }
  .pill.fenced { background: rgba(248,81,73,.25); color: var(--bad); }
  .pill.fix  { background: rgba(63,185,80,.18);  color: var(--ok); }
  .pill.weak { background: rgba(210,153,34,.18);  color: var(--warn); }
  .pill.nofix{ background: rgba(248,81,73,.18);   color: var(--bad); }
  .pill.stale{ background: rgba(139,148,158,.18); color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 12px; }
  .grid .k { color: var(--muted); }
  .grid .v { text-align: right; font-variant-numeric: tabular-nums; }
  .vs-on  { color: var(--ok); font-weight: 600; }
  .vs-off { color: var(--muted); }
  .warn-v { color: var(--warn); font-weight: 600; }

  /* ---- controls ---- */
  #controls { position: absolute; left: 10px; bottom: 10px; z-index: 1000; display: flex; gap: 6px; }
  #controls button, #controls label {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 7px 11px; font-size: 12px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); display: inline-flex; align-items: center; gap: 6px;
  }
  #controls button:not(.swarm-btn):hover { border-color: #3d4856; }

  /* Shape-drawing buttons: .armed = the drawing mode is active. */
  #controls button.armed { border-color: #3fc0ff; background: rgba(63,192,255,.22);
                           color: #9fd8ff; }
  .leaflet-container.drawing { cursor: crosshair !important; }
  .obstacle-popup button {
    background: #21262d; border: 1px solid var(--bad); color: var(--bad);
    border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer;
    margin-top: 4px;
  }
  .obstacle-popup button:hover { background: rgba(248,81,73,.15); }

  /* Heading mode selector (manual / convex hull) + point-inwards toggle. */
  #controls #heading-ctl { cursor: default; }
  #controls select {
    background: #21262d; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 6px; font-size: 12px; cursor: pointer;
  }

  /* Gimbal pitch slider: retargets every drone's gimbal tilt. */
  #controls #gimbal-ctl { cursor: default; }
  #controls #gimbal-slider { width: 110px; cursor: pointer; accent-color: #3fc0ff; }
  #controls #gimbal-val { min-width: 36px; text-align: right;
                          font-variant-numeric: tabular-nums; color: var(--muted); }

  /* Start/Stop swarming: chunky 3D pills — green = start, red = stop. The
     button for the state you're already in greys out (can't press it again). */
  #controls .swarm-btn {
    font-weight: 700; color: #fff; border-style: solid; border-width: 1px;
    border-bottom-width: 3px; padding: 7px 13px; text-shadow: 0 1px 1px rgba(0,0,0,.35);
    transition: transform .05s ease, box-shadow .05s ease, filter .1s ease;
  }
  #controls #btn-start.swarm-btn {
    background: linear-gradient(#3fb950, #2ea043);
    border-color: #1a7f37; border-bottom-color: #115a28;
    box-shadow: 0 2px 0 #115a28, 0 3px 7px rgba(0,0,0,.45);
  }
  #controls #btn-stop.swarm-btn {
    background: linear-gradient(#fa6a63, #da3633);
    border-color: #b62324; border-bottom-color: #861617;
    box-shadow: 0 2px 0 #861617, 0 3px 7px rgba(0,0,0,.45);
  }
  #controls .swarm-btn:not(:disabled):hover  { filter: brightness(1.08); }
  #controls .swarm-btn:not(:disabled):active {
    transform: translateY(2px);
    box-shadow: 0 0 0 rgba(0,0,0,0), 0 1px 3px rgba(0,0,0,.4);
  }
  /* The state you're already in: greyed, flattened, not clickable. */
  #controls .swarm-btn:disabled {
    background: #21262d; color: var(--muted);
    border-color: var(--line); border-bottom-color: #161b22;
    box-shadow: 0 2px 0 #161b22; text-shadow: none;
    cursor: not-allowed; opacity: .5; filter: none; transform: none;
  }

  #banner .chip.swarm-on  { background: rgba(63,185,80,.18);  color: #7ee787; border-color: rgba(63,185,80,.45); }
  #banner .chip.swarm-off { background: rgba(139,148,158,.16); color: var(--muted); }
  #banner .chip.fence-warn { background: rgba(248,81,73,.18); color: #ff938c; border-color: rgba(248,81,73,.45); }
  #banner .chip.joy-bad    { background: rgba(248,81,73,.18); color: #ff938c; border-color: rgba(248,81,73,.45); }
  /* Rotation-check chip + per-drone response colors */
  #banner .chip.rot-run  { background: rgba(63,192,255,.16);  color: #7cd6ff; border-color: rgba(63,192,255,.45); }
  #banner .chip.rot-ok   { background: rgba(63,185,80,.18);   color: #7ee787; border-color: rgba(63,185,80,.45); }
  #banner .chip.rot-bad  { background: rgba(248,81,73,.18);   color: #ff938c; border-color: rgba(248,81,73,.45); }
  .v.rot-ok   { color: #5cf2a6; }
  .v.rot-warn { color: #ffd23f; }
  .v.rot-bad  { color: #ff938c; font-weight: 700; }
  .pill.rot-ok   { background: rgba(63,185,80,.18);  color: #7ee787; }
  .pill.rot-warn { background: rgba(255,210,63,.16); color: #ffd23f; }
  .pill.rot-bad  { background: rgba(248,81,73,.18);  color: #ff938c; }

  /* Red ✕ overlaid on a geofence-breached (VS-disabled) drone's marker. */
  .drone-x { position: absolute; top: 0; left: 0; width: 40px; height: 40px;
             display: grid; place-items: center; font-size: 22px; font-weight: 800;
             color: var(--bad); text-shadow: 0 1px 3px #000; pointer-events: none; }

  /* ---- drone marker ---- */
  .drone-div { background: none; border: none; }
  .drone-wrap { position: relative; width: 40px; height: 52px; }
  .drone-arrow { position: absolute; top: 0; left: 0; width: 40px; height: 40px;
                 transform-origin: 50% 50%; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .drone-id { position: absolute; top: 38px; left: 0; width: 40px; text-align: center;
              font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px #000, 0 0 3px #000; }

  /* ---- distance label on each line ---- */
  .dist-label { background: rgba(13,17,23,.82); border: 1px solid var(--line);
                color: #cfe9ff; font-size: 11px; font-weight: 600; padding: 1px 6px;
                border-radius: 6px; box-shadow: none; white-space: nowrap; }
  .dist-label::before { display: none; }  /* hide Leaflet tooltip arrow */
  .dist-label.dist-ok  { color: #5cf2a6; border-color: rgba(92,242,166,.55); }
  .dist-label.dist-off { color: #ffd23f; border-color: rgba(255,210,63,.55); }

  .leaflet-container { background: #0d1117; }

  /* ---- cohesion-force plot (bottom-right; port of Unity TuneOlfatiSaber) ---- */
  /* Sits just left of the status panel (width 300 + margins) so it reads as the
     map's bottom-right corner without covering the cards. */
  #cohesion-panel {
    position: absolute; right: 320px; bottom: 10px; z-index: 1000; width: 380px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 2px 14px rgba(0,0,0,.5); padding: 8px 10px 6px;
    display: flex; flex-direction: column; gap: 5px;
  }
  #cohesion-panel .cp-hd { display: flex; justify-content: space-between;
    align-items: baseline; font-size: 12px; font-weight: 700; letter-spacing: .3px; }
  #cohesion-panel .cp-sub { color: var(--muted); font-weight: 400; font-size: 11px;
    font-variant-numeric: tabular-nums; }
  #cp-canvas { width: 100%; height: 210px; display: block; }
  @media (max-width: 760px) { #cohesion-panel { right: 10px; } }
</style>
</head>
<body>
  <div id="map"></div>

  <div id="banner" class="bad">
    <span class="dot"></span><span id="banner-text">Connecting…</span>
    <span class="sub" id="banner-sub"></span>
    <span class="chip" id="dref-chip" style="display:none"></span>
    <span class="chip" id="heading-chip" style="display:none"></span>
    <span class="chip" id="swarm-chip" style="display:none"></span>
    <span class="chip" id="joy-chip" style="display:none"></span>
    <span class="chip" id="fence-chip" style="display:none"></span>
    <span class="chip" id="rotcheck-chip" style="display:none"></span>
  </div>

  <div id="panel">
    <h1>Swarm status <span class="count" id="drone-count">0 drones</span></h1>
    <div id="cards"></div>
    <div id="params" style="display:none">
      <div class="params-hd">Olfati-Saber parameters</div>
      <div id="params-grid"></div>
    </div>
  </div>

  <div id="controls">
    <button id="btn-start" class="swarm-btn"
            title="Start sending swarming commands (arms Virtual Stick)">&#9654; Start swarming</button>
    <button id="btn-stop" class="swarm-btn" disabled
            title="Stop swarming — drones hold position (disarms Virtual Stick)">&#9632; Stop swarming</button>
    <button id="btn-rotcheck"
            title="Open-loop actuation check (run while HOLDING, drones well separated): each drone in turn flies a short pulse north then east at its current altitude; the GPS track gives a per-drone rotation/gain verdict (OK / SKEWED / ROTATED / SWAPPED / DEAD). Any verdict other than OK means the drone executes commands in the wrong direction — do NOT start swarming with it.">&#10227; Rotation check</button>
    <label id="heading-ctl"
           title="Heading control: Manual = joystick yaw steers a shared target heading; Convex hull = drones on the swarm's outer ring face outward (GLOBAL_CONVEXHULL), interior drones hold heading, stick yaw is ignored">
      Heading
      <select id="heading-select">
        <option value="manual">Manual</option>
        <option value="convexhull">Convex hull</option>
      </select>
    </label>
    <label id="inwards-ctl" style="display:none"
           title="Boundary drones face the swarm centroid instead of outward">
      <input type="checkbox" id="chk-inwards" /> Point inwards
    </label>
    <label id="gimbal-ctl" title="Gimbal pitch (tilt) for all drones — DJI Mini 3 Pro range -90° to +60°">
      Gimbal <input type="range" id="gimbal-slider" min="-90" max="60" step="1" value="-10" />
      <span id="gimbal-val">-10&deg;</span>
    </label>
    <button id="btn-add-obstacle"
            title="Draw a rectangular virtual obstacle: click and drag on the map (Esc cancels)">&#9635; Add obstacle</button>
    <button id="btn-clear-obstacles" title="Delete all obstacles">Clear obstacles</button>
    <button id="btn-add-fence"
            title="Draw the geofence: click the polygon vertices on the map, then double-click or press Finish (Esc cancels). Drones crossing outside get VS disabled and leave the flock until Stop/Start.">&#11040; Add geofence</button>
    <button id="btn-finish-fence" style="display:none"
            title="Close the geofence polygon with the vertices placed so far">Finish fence</button>
    <button id="btn-clear-fence" title="Remove the geofence">Clear fence</button>
    <button id="btn-cohesion"
            title="Toggle the live Olfati-Saber cohesion-force curve (bottom-right): the spacing potential vs inter-drone distance for the current tuning, with each drone pair's present distance marked on the curve">&#128200; Cohesion plot</button>
    <button id="btn-recenter" title="Fit the map to all drones">Recenter on swarm</button>
    <button id="btn-epfl" title="Jump back to EPFL Lausanne">EPFL</button>
    <label><input type="checkbox" id="chk-follow" /> Follow swarm</label>
  </div>

  <!-- Live cohesion-force plot (port of Unity TuneOlfatiSaber.cs). Hidden until
       toggled; drawn client-side from meta.olfati + meta.d_ref_m each poll. -->
  <div id="cohesion-panel" style="display:none">
    <div class="cp-hd">
      <span>Cohesion force &nbsp;<span style="color:var(--muted);font-weight:400">F(distance)</span></span>
      <span class="cp-sub" id="cp-sub"></span>
    </div>
    <canvas id="cp-canvas"></canvas>
  </div>

<script>
"use strict";

// EPFL Lausanne (Esplanade) — default view.
const EPFL = [46.5191, 6.5668];
const DEFAULT_ZOOM = 17;

// A drone whose telemetry hasn't been refreshed within this many seconds is
// considered gone (controller stopped sending it) and removed from the map.
const DRONE_STALE_S = 5.0;
// Below this satellite count we still place the drone but flag the fix as weak.
const MIN_SATS_GOOD = 6;
// Polling interval for /telemetry (ms).
const POLL_MS = 200;

// Stable per-drone colour palette (drone IDs are 1-based).
const COLORS = ['#ff5a5a','#3fc0ff','#5cf2a6','#ffd23f','#d77bff',
                '#ff8a3d','#33e6e6','#aaff4d','#ff5fa2','#e0ff3d'];
const colorFor = (id) => COLORS[(parseInt(id, 10) - 1 + COLORS.length) % COLORS.length];

// ---- map setup ----
const map = L.map('map', { zoomControl: true, attributionControl: true })
             .setView(EPFL, DEFAULT_ZOOM);

const imagery = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 21, maxNativeZoom: 19,
    attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' }
).addTo(map);

// Transparent labels/roads overlay so place + street names sit on the imagery.
const labels = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 21, maxNativeZoom: 19 }
).addTo(map);

L.control.layers(null, { 'Place & road labels': labels }, { collapsed: true }).addTo(map);

const linesLayer = L.layerGroup().addTo(map);
// Obstacles + geofence as echoed back from the controller (meta.obstacles /
// meta.geofence) — rebuilt each render outside the shapesPendingUntil window.
const shapesLayer = L.layerGroup().addTo(map);
const markers = {};   // id -> L.marker

// ---- helpers ----
// Horizontal distance in metres (equirectangular; exact enough at swarm scale,
// and matches the N/E hypot that swarm_flocking.py prints).
function distMeters(a, b) {
  const R = 6371000, d2r = Math.PI / 180;
  const lat1 = a.lat * d2r, lat2 = b.lat * d2r;
  const x = (b.lon - a.lon) * d2r * Math.cos((lat1 + lat2) / 2);
  const y = (lat2 - lat1);
  return Math.sqrt(x * x + y * y) * R;
}

function hasValidCoords(t) {
  return t && typeof t.lat === 'number' && typeof t.lon === 'number'
           && !(Math.abs(t.lat) < 1e-6 && Math.abs(t.lon) < 1e-6)
           && Math.abs(t.lat) <= 90 && Math.abs(t.lon) <= 180;
}

function droneIcon(id, heading, color, weak, fenced) {
  const h = Number.isFinite(heading) ? heading : 0;
  const op = fenced ? 0.45 : (weak ? 0.55 : 1.0);
  return L.divIcon({
    className: 'drone-div',
    iconSize: [40, 52],
    iconAnchor: [20, 20],   // centre of the arrow sits on the GPS position
    html: `
      <div class="drone-wrap">
        <div class="drone-arrow" style="transform: rotate(${h}deg);">
          <svg width="40" height="40" viewBox="0 0 40 40">
            <polygon points="20,3 32,35 20,28 8,35"
                     fill="${color}" fill-opacity="${op}"
                     stroke="#06121e" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
        ${fenced ? '<div class="drone-x">&#10006;</div>' : ''}
        <div class="drone-id" style="color:${color}">${id}</div>
      </div>`
  });
}

function fmt(v, d, suffix) {
  if (v === null || v === undefined || !Number.isFinite(v)) return '—';
  return v.toFixed(d) + (suffix || '');
}

// A Hz reading coloured against its nominal target rate: green near target,
// amber if it has dropped below ~70% (e.g. a blocking ds_wrapper call).
function hzCell(v, target) {
  if (!Number.isFinite(v)) return '<span class="v">—</span>';
  const cls = v >= 0.7 * target ? 'vs-on' : 'warn-v';
  return `<span class="v ${cls}">${v.toFixed(1)} Hz</span>`;
}

// ---- status cards ----

// Verdict/rotation color: OK green, SKEWED yellow, everything else red.
function rotClass(rot, verdict) {
  if (verdict === 'OK') return 'rot-ok';
  if (verdict === 'SKEWED') return 'rot-warn';
  if (verdict) return 'rot-bad';
  // live fit (no verdict): color by |rot| like the probe thresholds
  if (!Number.isFinite(rot)) return '';
  return Math.abs(rot) <= 25 ? 'rot-ok' : (Math.abs(rot) <= 60 ? 'rot-warn' : 'rot-bad');
}

function renderCard(id, rec, status, onHull, fenced, resp, rotRes) {
  const t = rec.telem || {};
  const age = rec.age;
  const color = colorFor(id);
  const card = document.createElement('div');
  card.className = 'card';
  card.style.borderLeftColor = color;

  const pill = { fix: ['fix', 'GPS OK'], weak: ['weak', 'WEAK GPS'],
                 nofix: ['nofix', 'NO FIX'], stale: ['stale', 'STALE'],
                 waiting: ['stale', 'WAITING'] }[status] || ['stale', '—'];

  const spd = (Number.isFinite(t.vx) && Number.isFinite(t.vy))
              ? Math.hypot(t.vx, t.vy) : null;
  const vsOn = !!t.vs_enabled;

  // Command->response line: the live ResponseMonitor fit while swarming, and
  // the last Rotation-check verdict while holding. rot 0° / gain 1 = healthy.
  const rr = rotRes || null;              // {rot, gain, verdict} from the probe
  const lv = resp || null;                // {rot, gain} live fit
  let respCell = '<span class="v">—</span>';
  let rotPill = '';
  if (lv && Number.isFinite(lv.rot)) {
    respCell = `<span class="v ${rotClass(lv.rot, null)}" title="Live fit: rotation between sent velocity commands and the GPS track (0° / gain 1 = healthy)">${lv.rot > 0 ? '+' : ''}${lv.rot.toFixed(0)}° ×${lv.gain.toFixed(2)}</span>`;
  } else if (rr) {
    respCell = `<span class="v ${rotClass(rr.rot, rr.verdict)}" title="Last rotation-check result">${Number.isFinite(rr.rot) ? (rr.rot > 0 ? '+' : '') + rr.rot.toFixed(0) + '° ×' + rr.gain.toFixed(2) : rr.verdict}</span>`;
  }
  if (rr && rr.verdict && rr.verdict !== 'OK') {
    rotPill = `<span class="pill ${rotClass(rr.rot, rr.verdict)}" style="margin-left:0" title="Rotation check: this drone did not fly its commands correctly — do not start swarming with it">${rr.verdict}</span>`;
  }

  card.innerHTML = `
    <div class="hdr">
      <span class="badge" style="background:${color}">${id}</span>
      <span class="name">Drone ${id}</span>
      ${fenced ? '<span class="pill fenced" style="margin-left:auto" title="Crossed outside the geofence — VS disabled, out of the flock; Stop then Start swarming to re-admit">FENCED OUT</span>' : ''}
      ${onHull ? `<span class="pill hull" ${fenced ? '' : 'style="margin-left:auto"'} title="On the swarm\'s convex hull — hull heading control is steering this drone">HULL</span>` : ''}
      ${rotPill}
      <span class="pill ${pill[0]}" ${(onHull || fenced || rotPill) ? 'style="margin-left:0"' : ''}>${pill[1]}</span>
    </div>
    <div class="grid">
      <span class="k">Alt</span>     <span class="v">${fmt(t.alt, 1, ' m')}</span>
      <span class="k">Heading</span> <span class="v">${fmt(t.heading, 0, '°')}</span>
      <span class="k">Gnd spd</span> <span class="v">${fmt(spd, 2, ' m/s')}</span>
      <span class="k">Climb</span>   <span class="v">${fmt(t.vz, 2, ' m/s')}</span>
      <span class="k">Sats</span>    <span class="v">${Number.isFinite(t.sat_count) ? t.sat_count : '—'}</span>
      <span class="k">VS</span>      <span class="v ${vsOn ? 'vs-on' : 'vs-off'}">${vsOn ? 'ENABLED' : 'off'}</span>
      <span class="k">Cmd&rarr;resp</span> ${respCell}
      <span class="k">Cmd rate</span>   ${hzCell(rec.send_hz, 20)}
      <span class="k">Telem rate</span> ${hzCell(rec.recv_hz, 10)}
      <span class="k">Link</span>    <span class="v">${fmt(age, 1, ' s')}</span>
    </div>`;
  return card;
}

// ---- Olfati-Saber parameter footer ----
// Compact number: trims trailing zeros so 10.0 -> "10", 0.9 -> "0.9".
function fmtNum(v) {
  if (!Number.isFinite(v)) return '—';
  return (Math.round(v * 1000) / 1000).toString();
}

// Show the STATIC swarm-algorithm parameters (published in meta.olfati by
// swarm_flocking.py) plus the live d_ref, so the operator can see the exact
// tuning being used to compute each drone's command.
function renderParams(o, dref, op) {
  const box = document.getElementById('params');
  const grid = document.getElementById('params-grid');
  if (!o) { box.style.display = 'none'; return; }
  box.style.display = '';
  const rows = [
    // d_ref is dynamic (joystick angular.x); flag it so it reads as "live".
    ['Target spacing d_ref', dref !== null ? fmtNum(dref) + ' m' : '—', true],
    ['Velocity match c_vm', fmtNum(o.c_vm), false],
    ['Cohesion radius r0', fmtNum(o.r0_coh), false],
    ['Scale factor', fmtNum(o.scale), false],
    ['ψ gain a', fmtNum(o.a), false],
    ['ψ gain b', fmtNum(o.b), false],
    ['ψ offset c', fmtNum(o.c), false],
    ['Bump δ', fmtNum(o.delta), false],
  ];
  if (op) {
    rows.push(['Obstacle cutoff d_obs', fmtNum(op.d_obs_m) + ' m', false],
              ['Obstacle radius r0_obs', fmtNum(op.r0_obs_m) + ' m', false],
              ['Obstacle gain c_obs', fmtNum(op.c_obs), false]);
  }
  grid.innerHTML = rows.map(([k, v, dyn]) =>
    `<span class="pk">${k}</span><span class="pv${dyn ? ' dyn' : ''}">${v}</span>`).join('');
}

// ---- main render ----
let didInitialFit = false;

function render(data) {
  // ----- feed banner -----
  const banner = document.getElementById('banner');
  const bText = document.getElementById('banner-text');
  const bSub  = document.getElementById('banner-sub');
  const fa = data.feed_age;
  if (fa === null || fa === undefined) {
    banner.className = 'bad';
    bText.textContent = 'No telemetry feed';
    bSub.textContent = '— is a controller running?';
  } else if (fa <= 2.0) {
    banner.className = 'ok';   bText.textContent = 'Feed connected';  bSub.textContent = `${fa.toFixed(1)} s ago`;
  } else if (fa <= 10.0) {
    banner.className = 'warn'; bText.textContent = 'Feed stale';      bSub.textContent = `${fa.toFixed(1)} s ago`;
  } else {
    banner.className = 'bad';  bText.textContent = 'Feed lost';       bSub.textContent = `${fa.toFixed(0)} s ago`;
  }

  // ----- target spacing (d_ref) -----
  const dref = (data.meta && Number.isFinite(data.meta.d_ref_m)) ? data.meta.d_ref_m : null;
  const chip = document.getElementById('dref-chip');
  if (dref !== null) {
    chip.style.display = '';
    chip.textContent = `Target spacing ${dref.toFixed(1)} m`;
  } else {
    chip.style.display = 'none';
  }
  const drefTol = dref !== null ? Math.max(1.0, 0.2 * dref) : null;

  // ----- Olfati-Saber parameters actually used for the command -----
  renderParams(data.meta && data.meta.olfati, dref,
               data.meta && data.meta.obstacle_params);

  // ----- heading mode + point-inwards -----
  // Reflect the controller's live setting (meta.heading_mode/point_inwards)
  // except in the short window after the operator changed a control, so the
  // 200 ms poll doesn't flip it back before the controller echoes the change.
  const meta = data.meta || {};
  if (Date.now() > headingPendingUntil) {
    if (meta.heading_mode === 'manual' || meta.heading_mode === 'convexhull') {
      headingSelect.value = meta.heading_mode;
    }
    if ('point_inwards' in meta) chkInwards.checked = !!meta.point_inwards;
  }
  const hullMode = headingSelect.value === 'convexhull';
  inwardsCtl.style.display = hullMode ? '' : 'none';
  const headingChip = document.getElementById('heading-chip');
  if (hullMode) {
    headingChip.style.display = '';
    headingChip.textContent = 'Hull heading' + (chkInwards.checked ? ' (inwards)' : '');
  } else {
    headingChip.style.display = 'none';
  }
  // Boundary drones (hull vertices) currently being steered by the hull.
  const hullSet = new Set(hullMode && Array.isArray(meta.hull_boundary)
                          ? meta.hull_boundary.map(String) : []);

  // ----- geofence-breached drones (VS disabled, out of the flock) -----
  const fencedSet = new Set(Array.isArray(meta.removed) ? meta.removed.map(String) : []);
  const fenceChip = document.getElementById('fence-chip');
  if (fencedSet.size > 0) {
    fenceChip.style.display = '';
    fenceChip.className = 'chip fence-warn';
    fenceChip.textContent = `${fencedSet.size} fenced out — Stop/Start to re-admit`;
  } else {
    fenceChip.style.display = 'none';
  }

  // ----- obstacles + geofence -----
  // Served by the GUI server's own store (data.shapes — seeded from
  // shapes.json, so they show with no controller running; synced from a live
  // controller's echo otherwise). Redraw is skipped during the short window
  // after a local edit so the 200 ms poll doesn't wipe an in-flight shape
  // (same pattern as headingPendingUntil above).
  const shapeSrc = data.shapes || meta;
  if (Date.now() > shapesPendingUntil) {
    shapesLayer.clearLayers();
    if (tempRect && drawMode !== 'obstacle') { map.removeLayer(tempRect); tempRect = null; }
    for (const ob of (Array.isArray(shapeSrc.obstacles) ? shapeSrc.obstacles : [])) {
      const r = L.rectangle([[ob.lat_min, ob.lon_min], [ob.lat_max, ob.lon_max]],
        { color: '#3fc0ff', weight: 2, fillColor: '#3fc0ff', fillOpacity: 0.18 });
      r.bindPopup(
        `<div class="obstacle-popup"><b>Obstacle ${ob.id}</b><br>` +
        `<button onclick="deleteObstacle(${Number(ob.id)})">Delete</button></div>`);
      shapesLayer.addLayer(r);
    }
    if (Array.isArray(shapeSrc.geofence) && shapeSrc.geofence.length >= 3) {
      shapesLayer.addLayer(L.polygon(shapeSrc.geofence,
        { color: '#f85149', weight: 4, dashArray: '8 5',
          fillColor: '#f85149', fillOpacity: 0.04 }));
    }
  }

  // ----- gimbal slider seeding -----
  // Reflect the controller's live gimbal pitch until the operator drags the
  // slider, after which the slider is authoritative (don't fight their input).
  if (!gimbalTouched && data.meta && Number.isFinite(data.meta.gimbal_pitch)) {
    gimbalSlider.value = data.meta.gimbal_pitch;
    showGimbal(gimbalSlider.value);
  }

  // ----- swarming state (Start/Stop) -----
  // The controller publishes meta.swarming; light up whichever button matches
  // the live state so the GUI reflects s1 toggles and button presses alike.
  const swarming = !!(data.meta && data.meta.swarming);
  const feedLive = (fa !== null && fa !== undefined && fa <= 10.0);
  const swarmChip = document.getElementById('swarm-chip');
  const bStart = document.getElementById('btn-start');
  const bStop  = document.getElementById('btn-stop');
  if (feedLive) {
    swarmChip.style.display = '';
    swarmChip.className = 'chip ' + (swarming ? 'swarm-on' : 'swarm-off');
    swarmChip.textContent = swarming ? 'SWARMING' : 'HOLDING';
  } else {
    swarmChip.style.display = 'none';
  }
  // ----- joystick feed health -----
  // The flocking controller publishes meta.joystick = false when no fresh
  // packet has arrived on :5055 (readController.py down / controller
  // unplugged). It refuses to arm in that state, so mirror it here: grey out
  // Start and show a chip. A missing key (older controller, or the
  // single-drone joystick_controller.py feed) means unknown — don't block.
  const joyLost = feedLive && !!(data.meta) && data.meta.joystick === false;
  const joyChip = document.getElementById('joy-chip');
  if (joyLost) {
    joyChip.style.display = '';
    joyChip.className = 'chip joy-bad';
    joyChip.textContent = 'NO JOYSTICK';
  } else {
    joyChip.style.display = 'none';
  }
  // Grey out the button for the state we're already in: Start is dead while
  // swarming, Stop is dead while held (and until Start is first pressed).
  // Start is also dead with no joystick feed (the controller would refuse).
  bStart.disabled = swarming || joyLost;
  bStart.title = joyLost
    ? 'No joystick input — start readController.py / reconnect the controller'
    : 'Start sending swarming commands (arms Virtual Stick)';
  bStop.disabled = !swarming;

  // ----- rotation check (open-loop actuation probe) -----
  const rc = meta.rotation_check || null;
  const rcRunning = !!(rc && rc.state === 'running');
  const bRot = document.getElementById('btn-rotcheck');
  bRot.disabled = swarming || rcRunning || !feedLive;
  const rcChip = document.getElementById('rotcheck-chip');
  if (rc && feedLive) {
    rcChip.style.display = '';
    const res = rc.results || {};
    if (rcRunning) {
      const done = Object.keys(res).length;
      rcChip.className = 'chip rot-run';
      rcChip.textContent = `Rot check: drone ${rc.drone == null ? '—' : rc.drone} ${rc.phase || ''} (${done} done)`;
    } else if (rc.state === 'refused') {
      rcChip.className = 'chip rot-bad';
      rcChip.textContent = `Rot check refused — ${rc.msg || ''}`;
    } else {   // done
      const verdicts = Object.values(res).map(r => r.verdict);
      const bad = verdicts.filter(v => v !== 'OK').length;
      rcChip.className = 'chip ' + (bad ? 'rot-bad' : 'rot-ok');
      rcChip.textContent = bad
        ? `Rot check: ${bad}/${verdicts.length} NOT OK — see cards`
        : `Rot check: all ${verdicts.length} OK`;
    }
  } else {
    rcChip.style.display = 'none';
  }
  // Per-drone data for the cards: live fit while swarming, probe verdicts after.
  const respMap = meta.resp || {};
  const rotResults = (rc && rc.results) || {};

  const drones = data.drones || {};
  const ids = Object.keys(drones).sort((a, b) => parseInt(a, 10) - parseInt(b, 10));

  // ----- per-drone classification -----
  const placed = [];   // {id, lat, lon} for drones drawn on the map
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  let liveCount = 0;

  for (const id of ids) {
    const rec = drones[id] || {};
    const t = rec.telem || {};
    const age = rec.age;

    let status;
    if (age > DRONE_STALE_S)                 status = 'stale';
    else if (Object.keys(t).length === 0)    status = 'waiting';
    else if (!hasValidCoords(t))             status = 'nofix';
    else if ((t.sat_count || 0) < MIN_SATS_GOOD) status = 'weak';
    else                                     status = 'fix';

    if (age <= DRONE_STALE_S) liveCount++;

    // Place on the map when we have coordinates and the link is alive.
    if (age <= DRONE_STALE_S && hasValidCoords(t)) {
      placed.push({ id, lat: t.lat, lon: t.lon });
      const weak = status === 'weak';
      const icon = droneIcon(id, t.heading, colorFor(id), weak, fencedSet.has(id));
      if (markers[id]) {
        markers[id].setLatLng([t.lat, t.lon]).setIcon(icon);
      } else {
        markers[id] = L.marker([t.lat, t.lon], { icon, zIndexOffset: 1000 }).addTo(map);
      }
      markers[id].bindTooltip(`Drone ${id}`, { direction: 'top', offset: [0, -22] });
    } else if (markers[id]) {
      map.removeLayer(markers[id]);
      delete markers[id];
    }

    // Status card for everything the controller still knows about.
    if (age <= DRONE_STALE_S) cards.appendChild(
      renderCard(id, rec, status, hullSet.has(id), fencedSet.has(id),
                 respMap[id] || null, rotResults[id] || null));
  }

  document.getElementById('drone-count').textContent =
    liveCount + (liveCount === 1 ? ' drone' : ' drones');

  // ----- complete-graph distance lines -----
  linesLayer.clearLayers();
  for (let i = 0; i < placed.length; i++) {
    for (let j = i + 1; j < placed.length; j++) {
      const a = placed[i], b = placed[j];
      const d = distMeters(a, b);
      // When the target spacing is known, tint each line by how close the pair
      // is to it: green within tolerance, amber when off-target.
      let lineColor = '#9fd8ff', labelCls = 'dist-label';
      if (dref !== null) {
        if (Math.abs(d - dref) <= drefTol) { lineColor = '#5cf2a6'; labelCls = 'dist-label dist-ok'; }
        else                               { lineColor = '#ffd23f'; labelCls = 'dist-label dist-off'; }
      }
      const poly = L.polyline([[a.lat, a.lon], [b.lat, b.lon]],
        { color: lineColor, weight: 1.8, opacity: 0.8,
          dashArray: dref !== null ? null : '4 4' });
      poly.bindTooltip(`${d.toFixed(1)} m`,
        { permanent: true, direction: 'center', className: labelCls });
      linesLayer.addLayer(poly);
    }
  }

  // ----- cohesion-force plot (bottom-right) -----
  // Uses the exact tuning the controller is flying (meta.olfati) and the live
  // physical target spacing (dref, metres); dots mark each pair's distance.
  renderCohesionPlot(data.meta && data.meta.olfati, dref, placed);

  // ----- camera -----
  if (placed.length > 0) {
    const follow = document.getElementById('chk-follow').checked;
    if (follow || !didInitialFit) {
      fitToSwarm(placed);
      didInitialFit = true;
    }
  }
}

function fitToSwarm(placed) {
  if (placed.length === 1) {
    map.setView([placed[0].lat, placed[0].lon], Math.max(map.getZoom(), 18));
  } else if (placed.length > 1) {
    const b = L.latLngBounds(placed.map(p => [p.lat, p.lon]));
    map.fitBounds(b, { padding: [80, 80], maxZoom: 20 });
  }
}

// ---- controls ----
// All controls POST to the GUI server, which forwards the payload to the
// flight controller over UDP. Best-effort; the live state comes back via
// meta.* on the next /telemetry poll, so we don't optimistically flip state.
async function postCommand(payload) {
  try {
    await fetch('/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  } catch (e) { /* controller/GUI down — banner already shows feed health */ }
}
document.getElementById('btn-start').addEventListener('click', () => postCommand({ action: 'start' }));
document.getElementById('btn-stop').addEventListener('click', () => postCommand({ action: 'stop' }));
document.getElementById('btn-rotcheck').addEventListener('click', () => postCommand({ action: 'rotation_check' }));

// Heading mode (manual / convex hull) + point-inwards. The controller owns the
// live value (meta.heading_mode / meta.point_inwards); render() reflects it
// back into these controls except during a short post-change window.
const headingSelect = document.getElementById('heading-select');
const inwardsCtl    = document.getElementById('inwards-ctl');
const chkInwards    = document.getElementById('chk-inwards');
let headingPendingUntil = 0;
headingSelect.addEventListener('change', () => {
  headingPendingUntil = Date.now() + 1500;
  inwardsCtl.style.display = headingSelect.value === 'convexhull' ? '' : 'none';
  postCommand({ action: 'heading', value: headingSelect.value });
});
chkInwards.addEventListener('change', () => {
  headingPendingUntil = Date.now() + 1500;
  postCommand({ action: 'point_inwards', value: chkInwards.checked });
});

// Gimbal pitch slider: retargets every drone's gimbal tilt. Forwarded to the
// controller, which folds the new value into the command it already streams at
// 20 Hz (no special command needed). Bounded to the DJI Mini 3 Pro tilt range.
const gimbalSlider = document.getElementById('gimbal-slider');
const gimbalVal    = document.getElementById('gimbal-val');
let gimbalTouched  = false;   // once the user drags, stop seeding from telemetry
function showGimbal(v) { gimbalVal.textContent = Math.round(v) + '°'; }
gimbalSlider.addEventListener('input', () => {
  gimbalTouched = true;
  showGimbal(gimbalSlider.value);
  postCommand({ action: 'gimbal', value: Number(gimbalSlider.value) });
});
showGimbal(gimbalSlider.value);

document.getElementById('btn-recenter').addEventListener('click', () => {
  const placed = Object.entries(markers).map(([id, m]) =>
    ({ id, lat: m.getLatLng().lat, lon: m.getLatLng().lng }));
  if (placed.length) fitToSwarm(placed);
  else map.setView(EPFL, DEFAULT_ZOOM);
});
document.getElementById('btn-epfl').addEventListener('click', () => {
  map.setView(EPFL, DEFAULT_ZOOM);
});

// ---- obstacle / geofence drawing ----
// One mode at a time: 'obstacle' = click-drag a rectangle, 'fence' = click
// polygon vertices then double-click / Finish. Map panning (and double-click
// zoom in fence mode) is disabled while drawing; Escape cancels. Confirmed
// shapes come back from the controller via meta.obstacles / meta.geofence and
// are drawn in render() — the temp layers here are just live feedback.
const btnAddObstacle    = document.getElementById('btn-add-obstacle');
const btnClearObstacles = document.getElementById('btn-clear-obstacles');
const btnAddFence       = document.getElementById('btn-add-fence');
const btnFinishFence    = document.getElementById('btn-finish-fence');
const btnClearFence     = document.getElementById('btn-clear-fence');

let drawMode = null;          // null | 'obstacle' | 'fence'
let dragStart = null, tempRect = null;
let fenceVerts = [], tempFence = null, tempFenceDots = [];
let shapesPendingUntil = 0;   // debounce for render()'s shape redraw

function setShapesPending() { shapesPendingUntil = Date.now() + 1500; }

function enterMode(mode) {
  exitMode();
  drawMode = mode;
  map.dragging.disable();
  if (mode === 'fence') map.doubleClickZoom.disable();
  map.getContainer().classList.add('drawing');
  (mode === 'obstacle' ? btnAddObstacle : btnAddFence).classList.add('armed');
  if (mode === 'fence') btnFinishFence.style.display = '';
}

// keepRect: a just-submitted obstacle keeps its temp rectangle on screen
// until the controller echoes it back (render() removes it then).
function exitMode(keepRect) {
  drawMode = null;
  map.dragging.enable();
  map.doubleClickZoom.enable();
  map.getContainer().classList.remove('drawing');
  btnAddObstacle.classList.remove('armed');
  btnAddFence.classList.remove('armed');
  btnFinishFence.style.display = 'none';
  dragStart = null;
  if (!keepRect && tempRect) { map.removeLayer(tempRect); tempRect = null; }
  if (tempFence) { map.removeLayer(tempFence); tempFence = null; }
  tempFenceDots.forEach(d => map.removeLayer(d));
  tempFenceDots = [];
  fenceVerts = [];
}

btnAddObstacle.addEventListener('click', () =>
  drawMode === 'obstacle' ? exitMode() : enterMode('obstacle'));
btnAddFence.addEventListener('click', () =>
  drawMode === 'fence' ? exitMode() : enterMode('fence'));
btnClearObstacles.addEventListener('click', () =>
  postCommand({ action: 'clear_obstacles' }));
btnClearFence.addEventListener('click', () =>
  postCommand({ action: 'clear_geofence' }));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && drawMode) exitMode();
});

// Obstacle: click-drag a rectangle (panning is off in this mode).
map.on('mousedown', (e) => {
  if (drawMode !== 'obstacle') return;
  dragStart = e.latlng;
  if (tempRect) map.removeLayer(tempRect);
  tempRect = L.rectangle(L.latLngBounds(dragStart, dragStart),
    { color: '#3fc0ff', weight: 2, dashArray: '4 3', fillOpacity: 0.12 }).addTo(map);
});
map.on('mousemove', (e) => {
  if (drawMode !== 'obstacle' || !dragStart || !tempRect) return;
  tempRect.setBounds(L.latLngBounds(dragStart, e.latlng));
});
map.on('mouseup', (e) => {
  if (drawMode !== 'obstacle' || !dragStart) return;
  const a = dragStart, b = e.latlng;
  dragStart = null;
  // Discard slivers/stray clicks (< 5 px on either axis).
  const pa = map.latLngToContainerPoint(a), pb = map.latLngToContainerPoint(b);
  if (Math.abs(pa.x - pb.x) < 5 || Math.abs(pa.y - pb.y) < 5) {
    if (tempRect) { map.removeLayer(tempRect); tempRect = null; }
    return;
  }
  postCommand({ action: 'add_obstacle',
                lat1: a.lat, lon1: a.lng, lat2: b.lat, lon2: b.lng });
  setShapesPending();   // temp rect stays until the meta echo replaces it
  exitMode(true);
});

// Fence: click vertices; double-click or the Finish button closes it.
map.on('click', (e) => {
  if (drawMode !== 'fence') return;
  fenceVerts.push(e.latlng);
  if (tempFence) map.removeLayer(tempFence);
  tempFence = L.polyline(fenceVerts,
    { color: '#f85149', weight: 3, dashArray: '8 5' }).addTo(map);
  tempFenceDots.push(L.circleMarker(e.latlng,
    { radius: 4, color: '#f85149', fillColor: '#f85149', fillOpacity: 1 }).addTo(map));
});
map.on('dblclick', () => {
  if (drawMode !== 'fence') return;
  // Leaflet fires click before dblclick, so the finishing double-click has
  // already pushed a duplicate final vertex — drop it.
  if (fenceVerts.length > 0) fenceVerts.pop();
  finishFence();
});
btnFinishFence.addEventListener('click', finishFence);

function finishFence() {
  if (drawMode !== 'fence' || fenceVerts.length < 3) return;  // need a triangle
  postCommand({ action: 'set_geofence',
                vertices: fenceVerts.map(p => [p.lat, p.lng]) });
  setShapesPending();
  exitMode();
}

// Obstacle-popup Delete button (popup HTML is a string, so this is global).
window.deleteObstacle = function (id) {
  postCommand({ action: 'delete_obstacle', id: id });
  map.closePopup();   // the echo removes the rectangle on the next poll
};

// ---- cohesion-force plot (port of Unity TuneOlfatiSaber.cs) ----
// A live plot of the Olfati-Saber spacing potential F vs inter-drone distance,
// drawn from the SAME parameters the controller is flying (meta.olfati) and the
// live target spacing (meta.d_ref_m). Each drone pair's current distance is
// marked on the curve (the JS equivalent of the C# neighbour markers), so the
// operator can see at a glance which pairs are being pulled together (F>0) or
// pushed apart (F<0) and where the cohesion well (F=0) sits.
const cohesionPanel = document.getElementById('cohesion-panel');
const cpCanvas      = document.getElementById('cp-canvas');
const btnCohesion   = document.getElementById('btn-cohesion');
let cohesionVisible = false;
btnCohesion.addEventListener('click', () => {
  cohesionVisible = !cohesionVisible;
  cohesionPanel.style.display = cohesionVisible ? '' : 'none';
  btnCohesion.classList.toggle('armed', cohesionVisible);
});

// Olfati-Saber cohesion math, mirrored 1:1 from olfati_saber.py (scaled units:
// r = physical_metres / scale, d_ref likewise). `o` is the meta.olfati dict.
function osNeighbourWeight(r, r0, o) {
  const rr = r / r0;
  if (rr < o.delta) return 1.0;
  if (rr < 1.0) { const a = Math.PI * (rr - o.delta) / (1 - o.delta);
                  return Math.pow(0.5 * (1 + Math.cos(a)), 2); }
  return 0.0;
}
function osNeighbourWeightDeriv(r, r0, o) {
  const rr = r / r0;
  if (rr < o.delta) return 0.0;
  if (rr < 1.0) { const a = Math.PI * (rr - o.delta) / (1 - o.delta);
                  return 0.5 * (-Math.PI) / (1 - o.delta) * (1 + Math.cos(a)) * Math.sin(a); }
  return 0.0;
}
function osCohesionIntensity(r, refd, o) {
  const diff = r - refd;
  return ((o.a + o.b) / 2) * (Math.sqrt(1 + Math.pow(diff + o.c, 2)) - Math.sqrt(1 + o.c * o.c))
       + ((o.a - o.b) * diff) / 2;
}
function osCohesionIntensityDeriv(r, refd, o) {
  const diff = r - refd;
  return ((o.a + o.b) / 2) * (diff + o.c) / Math.sqrt(1 + Math.pow(diff + o.c, 2))
       + (o.a - o.b) / 2;
}
function osCohesionForce(r, refd, o) {
  const r0 = o.r0_coh;
  return (1 / r0) * osNeighbourWeightDeriv(r, r0, o) * osCohesionIntensity(r, refd, o)
       + osNeighbourWeight(r, r0, o) * osCohesionIntensityDeriv(r, refd, o);
}

function renderCohesionPlot(o, drefM, placed) {
  if (!cohesionVisible) return;
  const cv = cpCanvas, ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cssW = cv.clientWidth || 358, cssH = cv.clientHeight || 210;
  if (cv.width !== Math.round(cssW * dpr) || cv.height !== Math.round(cssH * dpr)) {
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  const sub = document.getElementById('cp-sub');

  // No swarm params yet (no controller running, or --no-gui): placeholder.
  if (!o || !Number.isFinite(o.a)) {
    sub.textContent = '';
    ctx.fillStyle = '#8b949e';
    ctx.font = '12px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Waiting for swarm parameters…', cssW / 2, cssH / 2);
    return;
  }

  const scale = Number.isFinite(o.scale) && o.scale > 0 ? o.scale : 10;
  const drefPhys = (Number.isFinite(drefM) ? drefM : 7.0);   // physical metres
  const drefScaled = drefPhys / scale;
  // Physical-metre x range: always show the cohesion well (F=0 near d_ref+0.258·scale).
  const maxD = Math.max(20, drefPhys * 3);

  // Sample the curve and auto-scale the symmetric force axis to it.
  const N = 220, fs = new Array(N);
  let maxAbs = 1e-6;
  for (let i = 0; i < N; i++) {
    const dPhys = maxD * i / (N - 1);
    const f = osCohesionForce(dPhys / scale, drefScaled, o);
    fs[i] = f;
    if (Number.isFinite(f)) maxAbs = Math.max(maxAbs, Math.abs(f));
  }
  const fRange = maxAbs * 1.15;

  // Plot area (leave room for axis labels).
  const mL = 46, mR = 12, mT = 10, mB = 26;
  const pw = cssW - mL - mR, ph = cssH - mT - mB;
  const x2px = d => mL + (d / maxD) * pw;
  const f2py = f => mT + ph * 0.5 - (f / fRange) * (ph * 0.5);
  const y0 = f2py(0);

  // Grid + tick labels.
  ctx.font = '10px "Segoe UI", system-ui, sans-serif';
  ctx.strokeStyle = '#2a3340'; ctx.fillStyle = '#8b949e'; ctx.lineWidth = 1;
  const xTicks = 5, yTicks = 4;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let i = 0; i <= xTicks; i++) {
    const d = maxD * i / xTicks, x = x2px(d);
    ctx.beginPath(); ctx.moveTo(x, mT); ctx.lineTo(x, mT + ph); ctx.stroke();
    ctx.fillText(d.toFixed(0), x, mT + ph + 4);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= yTicks; i++) {
    const f = fRange - (2 * fRange) * i / yTicks, y = f2py(f);
    ctx.beginPath(); ctx.moveTo(mL, y); ctx.lineTo(mL + pw, y); ctx.stroke();
    ctx.fillText(f.toFixed(2), mL - 5, y);
  }

  // Axes: Y at x=0, and the F=0 line highlighted.
  ctx.strokeStyle = '#586069'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(mL, mT); ctx.lineTo(mL, mT + ph); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mL, y0); ctx.lineTo(mL + pw, y0); ctx.stroke();

  // d_ref marker (vertical dashed line).
  const xRef = x2px(drefPhys);
  if (xRef >= mL && xRef <= mL + pw) {
    ctx.save();
    ctx.strokeStyle = '#9fd8ff'; ctx.setLineDash([4, 3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xRef, mT); ctx.lineTo(xRef, mT + ph); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#9fd8ff'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('d_ref', xRef, mT + 1);
  }

  // The cohesion-force curve (green), clipped to the plot area.
  ctx.save();
  ctx.beginPath(); ctx.rect(mL, mT, pw, ph); ctx.clip();
  ctx.strokeStyle = '#5cf2a6'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const x = x2px(maxD * i / (N - 1)), y = f2py(fs[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();

  // Pair markers: each unique inter-drone distance placed on the curve.
  let pairCount = 0;
  ctx.fillStyle = '#ffd23f';
  for (let i = 0; i < placed.length; i++) {
    for (let j = i + 1; j < placed.length; j++) {
      const dPhys = distMeters(placed[i], placed[j]);
      if (dPhys < 0 || dPhys > maxD) continue;
      pairCount++;
      const x = x2px(dPhys);
      const y = f2py(osCohesionForce(dPhys / scale, drefScaled, o));
      if (y < mT || y > mT + ph) continue;
      ctx.beginPath(); ctx.arc(x, y, 3, 0, 2 * Math.PI); ctx.fill();
    }
  }

  // X-axis caption.
  ctx.fillStyle = '#8b949e'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('distance (m)', mL + pw, mT + ph + 15);

  sub.textContent = `d_ref ${drefPhys.toFixed(1)} m · ${pairCount} pair${pairCount === 1 ? '' : 's'}`;
}

// ---- poll loop ----
async function tick() {
  try {
    const resp = await fetch('/telemetry', { cache: 'no-store' });
    render(await resp.json());
  } catch (e) {
    const banner = document.getElementById('banner');
    banner.className = 'bad';
    document.getElementById('banner-text').textContent = 'GUI server unreachable';
    document.getElementById('banner-sub').textContent = '';
  }
}
setInterval(tick, POLL_MS);
tick();
</script>
</body>
</html>
